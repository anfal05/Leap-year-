<!DOCTYPE html>
<html>
<head>
    <title>Leap Year</title>
</head>
<body>
    <h2>Leap Year Checker</h2>

    <script>
        let year = parseInt(prompt("Enter the year:"));

        if (year % 4 == 0) {
            document.write("Leap year");
        } else {
            document.write("Not a leap year");
        }
    </script>
</body>
</html>
